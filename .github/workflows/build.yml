name: Build static pages
on:
  push:
    paths:
      - 'gen/**'
      - 'index.html'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock sharp
      - run: node gen/images.js
      - run: node gen/generate.js
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A beach country guide about suggest-a-beach img sitemap.xml robots.txt index.html
          git diff --cached --quiet || git commit -m "Regenerate static pages"
          git push
