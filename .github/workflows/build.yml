name: Build static pages
on:
  push:
    paths:
      - 'gen/**'
      - 'index.html'
      - 'data.js'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock sharp
      - run: node gen/images.js
      - run: node gen/generate.js
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A beach region country guide about suggest-a-beach privacy new hidden-gems best find map packing-checklist img sitemap.xml robots.txt feed.xml favicon.svg site.webmanifest index.html near.json
          git diff --cached --quiet || git commit -m "Regenerate static pages"
          git push

      - name: Ping IndexNow (Bing, Yandex and others)
        continue-on-error: true
        run: |
          node <<'EOF'
          const fs = require('fs');
          const sm = fs.readFileSync('sitemap.xml', 'utf8');
          const urlList = [...sm.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m => m[1]).slice(0, 9000);
          const key = '4e9055410708b1c153ec1183576d2596';
          fetch('https://api.indexnow.org/indexnow', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json; charset=utf-8' },
            body: JSON.stringify({ host: 'euroshores.com', key, keyLocation: 'https://euroshores.com/' + key + '.txt', urlList })
          }).then(r => console.log('IndexNow status', r.status)).catch(e => console.log('IndexNow failed', e.message));
          EOF
