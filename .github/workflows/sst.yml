name: Fetch sea temperatures
on:
  push:
    paths:
      - 'gen/fetch_sst.py'
      - '.github/workflows/sst.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sst:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install netCDF4 numpy
      - run: python gen/fetch_sst.py
      - name: Commit sea temperature data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gen/sst.json
          git diff --cached --quiet || git commit -m "Update monthly sea temperatures (NOAA OISST 1991-2020)"
          git pull --rebase
          git push
